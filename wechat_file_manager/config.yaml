paths:
  storage: ~/Documents/WeChatStorage
sources:
- name: wechat4
  root: ~/Library/Containers/com.tencent.xinWeChat/Data/Documents/xwechat_files/
  target_folders:
  - msg/file
  - msg/video
- name: wechat3
  root: ~/Library/Containers/com.tencent.xinWeChat/Data/Library/Application Support/com.tencent.xinWeChat/2.0b4.0.9/
  target_folders:
  - Message/MessageTemp
  min_file_size: 0
settings:
  min_file_size: 1
  preserve_originals: true
  skip_patterns:
  - pic_thumb
  - _thumb
  - .DS_Store
state:
  last_run: null
